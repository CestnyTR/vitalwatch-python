# Test + PyPI yayını — trusted publishing (OIDC), token yok.
#
# Her push'ta testler desteklenen bütün Python sürümlerinde koşar. `v*` etiketi
# gönderildiğinde testler geçerse paket derlenir ve PyPI'ye yüklenir. Yükleme
# `pypi` ortamında koşar; GitHub'da bu ortama onay kuralı eklenirse yayın elle
# onaylanmadan çıkmaz.
name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    # 24.04 sabit: `requires-python >= 3.9` sözü yalnızca 3.9'da koşan testle
    # tutulabilir ve daha yeni imajlarda eski sürümler bulunmayabilir.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest flask django fastapi starlette httpx
      - run: python -m pytest -q

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Etiket ile paket sürümü ayrışırsa yayın durur: v0.1.2 etiketi
      # 0.1.1 içeren bir paketi yüklememeli.
      - name: Etiket ve sürüm eşleşiyor mu
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Etiket $GITHUB_REF_NAME, paket $version"; exit 1; }
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
