[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vitalwatch"
version = "0.2.4"
description = "Python reporter and server agent for VitalWatch Hub — server errors, slow requests, heartbeat"
readme = "README.md"
license = "MIT"
authors = [{ name = "CestnyTR" }]
requires-python = ">=3.9"
keywords = ["monitoring", "error-tracking", "flask", "wsgi", "vitalwatch", "log-monitoring", "server-agent"]

# Bağımlılık YOK ve olmayacak: paket izlenen projelere kurulur, her bağımlılık
# orada bir sürüm çakışması riskidir. Flask entegrasyonu flask'ı yalnızca
# kullanıldığı anda ve kendi içinde import eder.
dependencies = []

[project.urls]
Homepage = "https://github.com/CestnyTR/vitalwatch-python"
Hub = "https://github.com/CestnyTR/vitalwatch-hub"

[project.scripts]
vitalwatch-status = "vitalwatch.cli:main"
vitalwatch-agent = "vitalwatch.agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
